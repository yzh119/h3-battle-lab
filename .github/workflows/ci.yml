name: Verify source and battlefield
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm test
      - run: python3 tests/exporter.test.py
      - run: python3 tests/native-profile.test.py
      - run: python3 tests/custom-pack.test.py
      - run: python3 tests/native-custom.test.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
